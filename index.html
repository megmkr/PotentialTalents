<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Potential Talents</title>
      <link rel="stylesheet" href="styles.css" />
   </head>
   <body>
      <main>
         <section class="app" aria-labelledby="page-title">
            <header>
               <p class="eyebrow">Potential talent</p>
               <h1 id="page-title">Find the right people, <span class="rubik-glitch-regular" style="color: var(--accent-dark)">faster.</span></h1>
               <p class="intro">
                  Let our candidate finder help you quickly identify the best talent for the job. <br />
                  Star candidates to see similar results.
               </p>
            </header>

            <section class="search-panel" aria-label="Candidate search">
               <label for="search-input">Search candidates</label>
               <div class="search-row">
                  <input id="search-input" type="search" placeholder="Try Student, HR, or Communications..." autocomplete="off" />
               </div>
            </section>

            <div class="results-heading">
               <h2>Ranked candidates</h2>
               <p id="result-count" aria-live="polite"></p>
            </div>
            <section id="candidate-list" aria-live="polite"></section>
         </section>
      </main>

      <script type="module" src="script.js"></script>
   </body>
</html>
